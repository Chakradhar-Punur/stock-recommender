<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Recommender</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f5f7;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
    margin: 0;
  }
  .container { width: 100%; max-width: 420px; }
  h1 { font-size: 1.4rem; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 24px; }
  .input-row { display: flex; gap: 8px; }
  input {
    flex: 1;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #93c5fd; cursor: not-allowed; }
  #result { margin-top: 24px; }
  .card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    text-align: center;
  }
  .card .ticker { font-size: 1.1rem; color: #555; margin-bottom: 8px; }
  .card .rec { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
  .rec.buy  { color: #16a34a; }
  .rec.hold { color: #6b7280; }
  .rec.sell { color: #dc2626; }
  .card .confidence { color: #888; font-size: 0.9rem; }
  .status { text-align: center; color: #888; margin-top: 24px; }
  .error { text-align: center; color: #dc2626; margin-top: 24px; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Stock Recommender</h1>
  <p class="subtitle">Try: MSFT, AAPL, GOOGL</p>

  <div class="input-row">
    <input id="ticker-input" type="text" placeholder="Enter a ticker, e.g. MSFT">
    <button id="analyze-btn">Analyze</button>
  </div>

  <div id="result"></div>
</div>

<script>
  // Backend must already be running (see app.py's docstring for the
  // uvicorn command) — this is a static file with no build step, so it
  // just talks to a hardcoded local API URL.
  const API_BASE = "http://localhost:8000";

  const input = document.getElementById("ticker-input");
  const button = document.getElementById("analyze-btn");
  const resultEl = document.getElementById("result");

  async function analyze() {
    const ticker = input.value.trim().toUpperCase();
    if (!ticker) return;

    button.disabled = true;
    resultEl.innerHTML = `<p class="status">Analyzing ${ticker}...</p>`;

    try {
      const response = await fetch(`${API_BASE}/score/${ticker}`);
      const data = await response.json();

      if (!response.ok) {
        // FastAPI's HTTPException puts the message in "detail".
        throw new Error(data.detail || `Request failed (${response.status})`);
      }

      const recClass = data.recommendation.toLowerCase(); // buy / hold / sell
      resultEl.innerHTML = `
        <div class="card">
          <div class="ticker">${data.ticker}</div>
          <div class="rec ${recClass}">${data.recommendation}</div>
          <div class="confidence">Confidence: ${data.confidence}%</div>
        </div>`;
    } catch (err) {
      // Covers both API error responses and network failures (e.g. the
      // backend isn't running at all, which fetch() surfaces as a
      // generic "Failed to fetch" TypeError).
      const message = err.message === "Failed to fetch"
        ? "Can't reach the API. Is the backend running on localhost:8000?"
        : err.message;
      resultEl.innerHTML = `<p class="error">${message}</p>`;
    } finally {
      button.disabled = false;
    }
  }

  button.addEventListener("click", analyze);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") analyze(); });
</script>
</body>
</html>
